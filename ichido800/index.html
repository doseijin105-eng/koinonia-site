"use strict";

const ruby=s=>s.replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const COPY='<div class="copy">聖書 新改訳2017©2017新日本聖書刊行会</div>';

// ---------- 画像 ----------
const IMG={};
const HEROES=['elea','sham','abi','ben'];const HFR=['idle','run1','run2','run3','spin1','spin2','spin3','spin4','spin5','spin6','hurt','win'];
const LIST=[...HEROES.flatMap(k=>HFR.map(f=>k+'_'+f)),'fx_dash','fx_spear','fx_snow','fx_stomp','yosh_cutin','elea_cutin','sham_cutin','abi_cutin','ben_cutin','field','it_water','it_grape','it_star','it_guard','it_horn','it_coin','idle','run1','run2','run3','spin1','spin2','spin3','spin4','spin5','spin6','hurt','win','foot','shield','archer','chariot','boss','fly1','fly2','fly3','ring','i_heart','i_spear','i_feet','i_rock','i_armor','i_horn'];

  ps.push(new Promise(r=>{const g=new Image();g.onload=()=>{IMG.cutin_bg=g;r();};g.onerror=()=>r();g.src='assets/cutin_bg.jpg';}));
  return Promise.all(ps);
}

// ---------- 画面 ----------
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let W,H,DPR,S,groundPat=null;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.height=H+'px';S=Math.min(W/430,H/760);if(S<0.6)S=0.6;}

const WORLD=1800;

// ---------- 音 ----------
let ac=null;
let master=null;
function initAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const c=ac.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;master=ac.createGain();master.gain.value=.9;master.connect(c);c.connect(ac.destination);}if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
const OUT=()=>master||ac.destination;
const m2f=m=>440*Math.pow(2,(m-69)/12);
function noiseF(d,v,type,f0,f1,delay){if(!ac||!save.sound)return;try{const t0=ac.currentTime+(delay||0);const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type=type||'bandpass';f.frequency.setValueAtTime(f0||1000,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+d);f.Q.value=type==='bandpass'?1.2:.7;g.gain.value=v||.1;s.connect(f);f.connect(g);g.connect(OUT());s.start(t0);}catch(e){}}
// ためているときのうなり
let chg=null;
function chargeSet(on,g){if(!ac||!save.sound)on=false;try{
  if(on&&!chg){const o=ac.createOscillator(),o2=ac.createOscillator(),gn=ac.createGain();o.type='sawtooth';o2.type='square';gn.gain.value=0;o.connect(gn);o2.connect(gn);gn.connect(OUT());o.start();o2.start();chg={o,o2,gn};}
  if(chg){const t=ac.currentTime;if(on){chg.o.frequency.setTargetAtTime(110+330*g,t,.05);chg.o2.frequency.setTargetAtTime(220+660*g+(g>=1?Math.sin(t*30)*20:0),t,.05);chg.gn.gain.setTargetAtTime(.012+.022*g,t,.05);}else{chg.gn.gain.setTargetAtTime(0,t,.03);const c=chg;chg=null;setTimeout(()=>{try{c.o.stop();c.o2.stop();}catch(e){}},200);}}
}catch(e){}}
function sfxSwing(n,combo){
  noiseF(.28,.22,'bandpass',300,3200);
  if(n>0){tone(95,.55,'sine',.35,.3);noiseF(.18,.18,'lowpass',900,120,.01);}
  if(n>=30)noiseF(.7,.12,'highpass',3000,6000,.02);
  const k=n>=100?1.5:n>=30?1.25:1;if(n>0)[523,659,784].forEach((f,i)=>tone(f*k,.32,'square',.03,0,.03+i*.015));
  if(n>=100)[1047,1319,1568,2093].forEach((f,i)=>tone(f,.18,'triangle',.035,0,.12+i*.06));
  if(combo>=2){const b=660*Math.pow(2,Math.min(combo,10)/12);tone(b,.1,'square',.035,0,.18);tone(b*1.5,.16,'square',.035,0,.25);}
}
function tone(f,d,type,v,slide,delay){if(!ac||!save.sound)return;try{const t0=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(OUT());o.start(t0);o.stop(t0+d+.02);}catch(e){}}
function noise(d,v){if(!ac||!save.sound)return;try{const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=v||.15;s.connect(g);g.connect(OUT());s.start();}catch(e){}}

function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
// BGM(チップチューン風・勇ましいDマイナー)
let bgmOn=false,bgmNext=0,bgmStep=0;const USE_FILES=true;
const ROOTS=[50,46,48,45];
const CHORDS=[[62,65,69,74],[58,62,65,70],[60,64,67,72],[57,61,64,69]];
const LEAD=[74,0,77,0,81,0,79,77,76,0,77,0,74,0,0,0, 74,0,77,0,82,0,81,79,77,0,79,0,77,0,74,0, 72,0,76,0,79,0,84,0,83,0,81,0,79,0,76,0, 73,0,76,0,81,0,79,0,77,0,76,0,73,0,0,0];
function bv(type,f,t,d,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(OUT());o.start(t);o.stop(t+d+.02);return o;}
function bn(t,d,v,type,f){const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate),a=b.getChannelData(0);for(let k=0;k<a.length;k++)a[k]=(Math.random()*2-1)*(1-k/a.length);const sN=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();sN.buffer=b;fl.type=type;fl.frequency.value=f;g.gain.value=v;sN.connect(fl);fl.connect(g);g.connect(OUT());sN.start(t);}
function bgmTick(){
  if(!ac||!save.sound||!bgmOn||USE_FILES)return;
  const st=60/(mode==='ta'?158:142)/4;
  const intense=mode==='ta'||hero.g>=.8||enemies.length>45;
  while(bgmNext<ac.currentTime+.25){
    const t=bgmNext,i=bgmStep%16,bar=Math.floor(bgmStep/16)%4,r=ROOTS[bar];
    try{
      if(i%4===0||(intense&&i===10)){const o=bv('sine',120,t,.2,.22);o.frequency.exponentialRampToValueAtTime(40,t+.16);}
      if(i===4||i===12)bn(t,.14,.09,'bandpass',1900);
      if(i%2===1)bn(t,.035,.03,'highpass',7000);
      if(i%2===0)bv('triangle',m2f(r-12+(i%4===2?12:0)),t,st*1.9,.09);
      if(i%2===0)bv('sawtooth',m2f(r-24),t,st*1.6,.025);
      const n=LEAD[bar*16+i];if(n){bv('square',m2f(n),t,st*1.8,.035);bv('square',m2f(n)*1.004,t,st*1.8,.018);}
      if(intense){const c=CHORDS[bar];bv('square',m2f(c[i%4]+12),t,st*.9,.014);}
    }catch(e){}
    bgmNext+=st;bgmStep++;
  }
}
function bgmStart(){if(!ac)return;bgmOn=true;bgmNext=ac.currentTime+.05;}
setInterval(bgmTick,50);
// ---------- 音楽(Geminiで作った曲) ----------
const MUS={story:'bgm_story',ta:'bgm_ta',surv:'bgm_surv',field:'bgm_field'};const AUD={};let curTrack=null,menuTrack='title',jingleUntil=0,duckUntil=0;
function aud(n){if(!AUD[n]){const a=new Audio('assets/music/'+n+'.mp3');a.preload='auto';AUD[n]=a;}return AUD[n];}
function stopTrack(){if(curTrack){try{AUD[curTrack].pause();}catch(e){}}curTrack=null;}
function wantTrack(){if(!save.sound)return null;const now=performance.now();if(now<jingleUntil)return null;
  if(state==='play'){if(paused||!bgmOn||cleared)return null;return enemies.some(e=>e.type==='boss'&&e.doom==null)?'bgm_boss':(MUS[mode]||'bgm_story');}
  return state==='over'?'bgm_title':menuTrack==='crown'?'bgm_crown':'bgm_title';}
function musicTick(){const w=wantTrack();if(w!==curTrack){stopTrack();if(w){const a=aud(w);a.loop=true;try{a.currentTime=0;}catch(e){}a.volume=.5;curTrack=w;a.play().catch(()=>{curTrack=null;});}}
  else if(curTrack){const a=AUD[curTrack];const v=performance.now()<duckUntil?.15:.5;if(Math.abs(a.volume-v)>.01)a.volume=v;if(a.paused)a.play().catch(()=>{});}
  if(!save.sound)for(const k in AUD)if(!AUD[k].paused)AUD[k].pause();}
function jingle(n,stopBgm){if(!save.sound)return;const a=aud(n);a.loop=false;a.volume=.85;try{a.currentTime=0;}catch(e){}a.play().catch(()=>{});const ms=(n==='jingle_clear'?9:n==='jingle_over'?5.4:4.4)*1000;if(stopBgm){jingleUntil=performance.now()+ms;stopTrack();}else duckUntil=performance.now()+ms;}
setInterval(musicTick,250);
